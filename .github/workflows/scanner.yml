name: Hourly Forex Scanner

on:
  schedule:
    - cron: '0 * * * *' # تشغيل السكربت تلقائياً مع بداية كل ساعة
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت للترتيب

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python multi_asset_scanner.py
