name: Hourly Forex Scanner

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python multi_asset_scanner.py

      - name: Push updated signal to GitHub
        run: |
          git config --global user.name "Forex Bot"
          git config --global user.email "bot@forex.local"
          git add signal.json
          git commit -m "Update trading signal" || exit 0
          git pull --rebase origin main || true
          git push
