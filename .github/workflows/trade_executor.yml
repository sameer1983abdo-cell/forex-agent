name: Trade Executor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir urllib3 protobuf service_identity "Twisted[tls]" "pyOpenSSL>=24.0.0" "cryptography>=42.0.0" ctrader-open-api
          python -c "import ctrader_open_api; print('ctrader_open_api import OK')"

      - name: Run trade executor
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
        run: python execute_trade.py

      - name: Commit updated signal state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_executed_signal.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update last_executed_signal.json"
            git push
          fi
